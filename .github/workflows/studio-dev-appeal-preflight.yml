name: Studio Dev actual appeal read-only preflight
on:
  push:
    branches: [audit/studio-dev-real-appeal-20261014]
    paths:
      - .github/workflows/studio-dev-appeal-preflight.yml
      - scripts/studio_dev_live_appeal_preflight.py
      - scripts/studio_dev_rpc_backend_diagnostics.py
      - scripts/studio_dev_alternate_live_state.py
      - scripts/studio_dev_alternate_gen_call.py
  workflow_dispatch:
permissions:
  contents: write
jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Install pinned GenLayer SDK
        run: python -m pip install -r requirements-lock.txt
      - name: Check historical Studio Dev case without a wallet or transaction
        run: python scripts/studio_dev_live_appeal_preflight.py
      - name: Check direct node RPC state without GenVM or wallet signing
        run: python scripts/studio_dev_rpc_backend_diagnostics.py
      - name: Check explorer history and alternate RPC readonly methods
        run: python scripts/studio_dev_alternate_live_state.py
      - name: Attempt alternate contract read-only GenVM executions
        run: python scripts/studio_dev_alternate_gen_call.py
      - name: Preserve sanitized findings only in this private audit work branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evidence/STUDIO_DEV_APPEAL_LIVE_PREFLIGHT_2026-10-14.md evidence/STUDIO_DEV_RPC_BACKEND_DIAGNOSTICS_2026-10-14.md evidence/STUDIO_DEV_ALTERNATIVE_READS_2026-10-14.md evidence/STUDIO_DEV_ALTERNATIVE_GEN_CALL_2026-10-14.md
          if ! git diff --cached --quiet; then
            git commit -m "evidence(audit): real Studio Dev requester-only appeal preflight"
            git fetch origin audit/studio-dev-real-appeal-20261014
            git rebase origin/audit/studio-dev-real-appeal-20261014
            git push origin HEAD:audit/studio-dev-real-appeal-20261014
          fi
