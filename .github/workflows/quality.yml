name: Quality

on:
  push:
  pull_request:

jobs:
  direct-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12.14"
      - run: python -m pip install -r requirements-lock.txt
      - run: python -m pip check
      - run: python scripts/verify_toolchain_bundles.py
      - run: python -m compileall -q contracts tests
      - run: genvm-lint lint contracts/consensus_guard.py --json
      - run: python scripts/check_contract_sdk.py
      - run: pyright -p pyrightconfig.json --outputjson
      - run: pytest -q
        env:
          GENVM_PREBUILT_DIR: ${{ github.workspace }}/vendor
          CONSENSUSGUARD_GENVM_CACHE: ${{ runner.temp }}/consensusguard-genlayer-gltest-cache
