name: ConsensusGuard updated final ZIP with live signed Studio Dev appeal
on:
  push:
    branches:
      - audit/studio-dev-real-appeal-20261014
    paths:
      - .github/workflows/studio-dev-final-proof-zip.yml
permissions:
  contents: read
  actions: read
jobs:
  complete-live-evidence-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GITHUB_TOKEN: ${{ github.token }}
      GENVM_PREBUILT_DIR: ${{ github.workspace }}/vendor
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Full fresh QA and signed Studio Dev proof verified archive construction
        run: bash scripts/run_phase7_ci.sh
      - name: Publish exactly one new ZIP for complete latest audit sources
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ConsensusGuard_FINAL_LIVE_STUDIO_DEV_APPEAL_PROVEN
          path: package/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
      - name: Download same ZIP and independently verify every file
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ConsensusGuard_FINAL_LIVE_STUDIO_DEV_APPEAL_PROVEN
          path: /tmp/cg-live-final-recheck
      - name: Confirm exact SHA256 manifest and no omitted file
        run: |
          python /tmp/cg-live-final-recheck/verify_sha256.py
          diff -qr package/ /tmp/cg-live-final-recheck/
          echo CONSENSUSGUARD_LIVE_SIGNED_APPEAL_COMPLETE_ZIP_PASS
