name: Studio Dev latest source fresh signed full lifecycle ONCE
on:
  push:
    branches:
      - audit/studio-dev-real-appeal-20261014
    paths:
      - .github/workflows/studio-dev-fresh-signed-end-to-end-once.yml
permissions:
  contents: write
jobs:
  one-time-dev-integrity-run:
    runs-on: ubuntu-24.04
    timeout-minutes: 19
    env:
      CONSENSUSGUARD_DEV_WRITE_AUTH: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Install official pinned GenLayer test SDK
        run: python -m pip install -r requirements-lock.txt
      - name: Write at most one fresh Studio Dev test lifecycle and require finalized state
        run: python scripts/studio_dev_signed_e2e_once.py
      - name: Save redacted proof of successful or failed live operation only in this audit branch
        if: always()
        run: |
          set -euo pipefail
          test -f evidence/STUDIO_DEV_PHASE7_SIGNED_APPEAL_2026-10-14.md || exit 0
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git config user.name 'github-actions[bot]'
          git add evidence/STUDIO_DEV_PHASE7_SIGNED_APPEAL_2026-10-14.md
          if ! git diff --cached --quiet; then
            git commit -m 'evidence(audit): one-time fresh Studio Dev signed lifecycle or exact failure'
            git fetch origin audit/studio-dev-real-appeal-20261014
            git rebase origin/audit/studio-dev-real-appeal-20261014
            git push origin HEAD:audit/studio-dev-real-appeal-20261014
          fi
