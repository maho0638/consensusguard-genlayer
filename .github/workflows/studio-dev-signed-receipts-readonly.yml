name: Studio Dev independent signed receipts readonly audit
on:
  push:
    branches:
      - audit/studio-dev-real-appeal-20261014
    paths:
      - .github/workflows/studio-dev-signed-receipts-readonly.yml
      - scripts/studio_dev_signed_receipt_recheck.py
permissions:
  contents: write
jobs:
  receipt-integrity:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Independently prove signed transactions and deployed code SHA256
        run: python scripts/studio_dev_signed_receipt_recheck.py
      - name: Publish signed transaction audit evidence on isolated branch
        if: always()
        run: |
          set -euo pipefail
          test -f evidence/STUDIO_DEV_SIGNED_APPEAL_RECEIPT_INDEPENDENT_AUDIT_2026-10-14.md || exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add evidence/STUDIO_DEV_SIGNED_APPEAL_RECEIPT_INDEPENDENT_AUDIT_2026-10-14.md
          if ! git diff --cached --quiet; then
            git commit -m 'evidence(audit): original signed Studio Dev appeal and exact source verification'
            git fetch origin audit/studio-dev-real-appeal-20261014
            git rebase origin/audit/studio-dev-real-appeal-20261014
            git push origin HEAD:audit/studio-dev-real-appeal-20261014
          fi
