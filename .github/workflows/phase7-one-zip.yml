name: Phase 7 final ZIP
on:
  push:
    branches:
      - audit/phase7-final-delivery-20261014
    paths:
      - .github/workflows/phase7-one-zip.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  final-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GENVM_PREBUILT_DIR: ${{ github.workspace }}/vendor
      CONSENSUSGUARD_GENVM_CACHE: ${{ runner.temp }}/phase7-genvm-cache
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Verify source, run quality suite, and assemble one complete directory
        run: bash scripts/run_phase7_ci.sh
      - name: Produce exactly one ZIP artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ConsensusGuard_FINAL_ONE_ZIP
          path: package/
          if-no-files-found: error
          include-hidden-files: true
          compression-level: 6
          retention-days: 30
      - name: Download same artifact to prove ZIP round trip
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ConsensusGuard_FINAL_ONE_ZIP
          path: /tmp/consensusguard-final-audited
      - name: Verify every extracted file against SHA256 manifest and local source
        run: |
          python /tmp/consensusguard-final-audited/verify_sha256.py
          diff -qr package/ /tmp/consensusguard-final-audited/
          echo PHASE7_FINAL_ZIP_ROUNDTRIP_PASS
