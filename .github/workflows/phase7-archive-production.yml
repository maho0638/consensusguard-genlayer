name: Phase 7 archive production
on:
  push:
    branches:
      - audit/phase7-final-delivery-20261014
    paths:
      - .github/workflows/phase7-archive-production.yml
      - scripts/build_phase7_package.py
      - scripts/run_phase7_ci.sh
  workflow_dispatch:
jobs:
  build-archive:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Build one audited package
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GENVM_PREBUILT_DIR: ${{ github.workspace }}/vendor
        run: bash scripts/run_phase7_ci.sh
      - name: Upload one ZIP archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ConsensusGuard_PHASE7_COMPLETE_ONE_ZIP
          path: package/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
      - name: Download and re-verify archive
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ConsensusGuard_PHASE7_COMPLETE_ONE_ZIP
          path: /tmp/phase7-verify
      - name: Verify content after ZIP extraction
        run: |
          python /tmp/phase7-verify/verify_sha256.py
          diff -qr package /tmp/phase7-verify
          echo PHASE7_VERIFIED_ONE_ZIP_SUCCESS
